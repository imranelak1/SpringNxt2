# ===== Application =====
spring.application.name=demo
server.port=8080
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.oauth2.client.servlet.OAuth2ClientAutoConfiguration

# ===== Database (MySQL / phpMyAdmin) =====
spring.datasource.url=jdbc:mysql://localhost:3306/nexus_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.defer-datasource-initialization=true

spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data.sql

# ===== JWT Configuration =====
jwt.secret=bXlTZWNyZXRLZXlGb3JKV1RUb2tlbkdlbmVyYXRpb24xMjM0NTY3ODkwMTIzNDU2Nzg5MDEyMzQ1Njc4OTA=
jwt.expiration=86400000

# ===== Mail Configuration (Gmail SMTP) =====
# To enable: set MAIL_USERNAME=you@gmail.com and MAIL_PASSWORD=your-16-char-app-password
# Generate an App Password at: https://myaccount.google.com/apppasswords (requires 2FA)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Sender address shown in emails
app.mail.from=${MAIL_USERNAME:nexus@springnxt.local}

# Set to true once MAIL_USERNAME/MAIL_PASSWORD are configured
app.notifications.enabled=true

# ===== App URLs =====
app.frontend-url=http://localhost:3000
app.backend-url=http://localhost:8080

# ===== API Documentation =====
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
